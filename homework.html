<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#143d61" />
    <title>אי שיעורי הבית · המסע של תמר</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="homework.css" />
    <script src="levels.js" defer></script>
    <script src="homework.js" defer></script>
  </head>
  <body>
    <main class="game-shell" id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>המסע של תמר</span></div>
        <button class="sound-button" id="sound-button" type="button" aria-label="כיבוי קול" title="כיבוי קול"><span aria-hidden="true">♪</span><span id="sound-label">קול פועל</span></button>
      </header>
      <section class="scene" aria-label="אי שיעורי הבית">
        <div class="sky-sun" aria-hidden="true"></div>
        <div class="cloud cloud-one" aria-hidden="true"></div>
        <div class="cloud cloud-two" aria-hidden="true"></div>
        <div class="island island-left" aria-hidden="true"></div>
        <div class="island island-right" aria-hidden="true"></div>
        <div class="water water-back" aria-hidden="true"></div>
        <div class="boat" id="boat" aria-hidden="true"><div class="boat-mast"></div><div class="boat-sail">ת</div><div class="boat-hull"><span class="boat-eye"></span><span class="boat-smile"></span></div></div>
        <div class="water water-front" aria-hidden="true"></div>
        <div class="scene-badge" id="scene-badge">אי שיעורי הבית</div>
        <button class="scene-back" id="back-button" type="button" hidden>חזרה ↩</button>
      </section>
      <section class="panel homework-panel" id="panel" aria-live="polite"></section>
      <p class="sr-only" id="announcer" aria-live="assertive"></p>
    </main>
  </body>
</html>
